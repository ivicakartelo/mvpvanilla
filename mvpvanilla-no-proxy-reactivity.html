<!DOCTYPE html>
<html>
<body>
<h1>Vanilla JS</h1>
<p>Name: <input id="nameInput"></p>
<p>Preview: <span id="namePreview"></span></p>
<script>
  window.document.getElementById("nameInput").addEventListener("input",
  function () {
  window.document.getElementById("namePreview").innerText = this.value;});
</script>
</body>
</html>
